[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "shklovskiy-python-lab-08"
version = "0.1.0"
description = "Lab 8 variant 2: Poetry, requests, pytest, TDD, logging, CI and Docker"
authors = ["Шкловский Герман Вячеславович"]
readme = "README.md"
packages = [{ include = "calculator", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
requests = "^2.32"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
