name: Poetry CI and lockfile
on:
  push:
  pull_request:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Poetry
        run: python -m pip install "poetry>=2.1,<3"
      - name: Resolve dependencies using Poetry
        run: poetry lock
      - name: Install dependencies (non-package project)
        run: poetry install --no-root --with dev
      - name: Run pytest
        run: poetry run pytest -q
      - name: Commit generated Poetry lockfile on push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add poetry.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore: add Poetry-generated dependency lockfile"
            git push origin HEAD:main
          fi
